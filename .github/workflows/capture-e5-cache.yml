name: Capture e5rt Cache (M2)

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label (pin M2 Pro with macos-14-xlarge)"
        required: true
        default: "macos-14-xlarge"
      iterations:
        description: "Number of prediction iterations"
        required: true
        default: "8"
      require_ane:
        description: "Fail run if ANE device is unavailable (true/false)"
        required: true
        default: "false"

jobs:
  capture:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          python --version

      - name: Set up Python virtualenv + deps
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install coremltools numpy

      - name: Prepare + validate e5 cache directory access
        shell: bash
        run: |
          set -euxo pipefail
          CACHE_BASE="$HOME/Library/Caches/org.python.python/com.apple.e5rt.e5bundlecache"
          FALLBACK_BASE="$HOME/Library/Caches/com.apple.e5rt.e5bundlecache"
          rm -rf "$CACHE_BASE" "$FALLBACK_BASE"
          mkdir -p "$CACHE_BASE"
          test -d "$CACHE_BASE"
          test -r "$CACHE_BASE"
          test -w "$CACHE_BASE"
          PROBE_FILE="$CACHE_BASE/.rw_probe_$$"
          echo "probe" > "$PROBE_FILE"
          test -f "$PROBE_FILE"
          rm -f "$PROBE_FILE"
          echo "CACHE_BASE=$CACHE_BASE" >> "$GITHUB_ENV"
          echo "FALLBACK_BASE=$FALLBACK_BASE" >> "$GITHUB_ENV"

      - name: Trigger CoreML compile + inference (ANE-aware)
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          REQUIRE_ANE: ${{ inputs.require_ane }}
        run: |
          set -euxo pipefail
          ./.venv/bin/python - <<'PY'
          import os
          import tempfile
          import numpy as np
          import coremltools as ct
          from coremltools.converters.mil import Builder as mb

          iters = int(os.environ.get("ITERATIONS", "8"))
          require_ane = os.environ.get("REQUIRE_ANE", "false").lower() == "true"

          # Detect ANE availability; optionally require it.
          device_names = []
          try:
              from coremltools.models.compute_device import MLComputeDevice
              device_names = [type(d).__name__ for d in MLComputeDevice.get_all_compute_devices()]
          except Exception as e:
              raise RuntimeError(f"Unable to enumerate CoreML compute devices: {e}") from e
          print("compute_devices", device_names)
          has_ane = any("NeuralEngine" in name for name in device_names)
          if not has_ane and require_ane:
              raise RuntimeError(
                  "No Neural Engine compute device exposed and require_ane=true."
              )
          if has_ane:
              cu = ct.ComputeUnit.CPU_AND_NE
              print("compute_units", "CPU_AND_NE")
          else:
              # Virtualized runners often expose only CPU/GPU.
              cu = ct.ComputeUnit.ALL
              print("compute_units", "ALL (ANE unavailable; collecting best-effort cache artifacts)")

          @mb.program(input_specs=[mb.TensorSpec(shape=(1, 4), dtype=ct.converters.mil.mil.types.fp16)])
          def prog(x):
              y = mb.add(x=x, y=np.array([[1, 2, 3, 4]], dtype=np.float16), name="y")
              return y

          mlmodel = ct.convert(
              prog,
              convert_to="mlprogram",
              minimum_deployment_target=ct.target.macOS13,
              compute_units=ct.ComputeUnit.ALL,
          )

          out_dir = tempfile.mkdtemp(prefix="coreml_e5_trigger_")
          pkg_path = os.path.join(out_dir, "tiny_add.mlpackage")
          mlmodel.save(pkg_path)

          model = ct.models.MLModel(pkg_path, compute_units=cu)
          x = np.array([[1, 1, 1, 1]], dtype=np.float16)
          for _ in range(iters):
              _ = model.predict({"x": x})

          print("model_package", pkg_path)
          PY

      - name: Collect e5 cache inventory
        shell: bash
        run: |
          set -euxo pipefail
          ACTIVE_CACHE_BASE=""
          if [ -d "$CACHE_BASE" ] && [ "$(find "$CACHE_BASE" -type f | wc -l)" -gt 0 ]; then
            ACTIVE_CACHE_BASE="$CACHE_BASE"
          elif [ -d "$FALLBACK_BASE" ] && [ "$(find "$FALLBACK_BASE" -type f | wc -l)" -gt 0 ]; then
            ACTIVE_CACHE_BASE="$FALLBACK_BASE"
          elif [ -d "$CACHE_BASE" ]; then
            ACTIVE_CACHE_BASE="$CACHE_BASE"
          elif [ -d "$FALLBACK_BASE" ]; then
            ACTIVE_CACHE_BASE="$FALLBACK_BASE"
          fi

          echo "active_cache_base=${ACTIVE_CACHE_BASE:-<none>}" | tee active_cache_base.txt
          if [ -n "$ACTIVE_CACHE_BASE" ]; then
            find "$ACTIVE_CACHE_BASE" -type f | sort > e5_cache_file_list.txt
            find "$ACTIVE_CACHE_BASE" -name "*.e5" -print | sort > e5_files.txt
          else
            : > e5_cache_file_list.txt
            : > e5_files.txt
          fi
          wc -l e5_cache_file_list.txt e5_files.txt

      - name: Broader .e5 scan (best effort)
        shell: bash
        run: |
          set -euxo pipefail
          find "$HOME/Library/Caches" -name "*.e5" 2>/dev/null | sort > e5_home_cache_scan.txt || true
          find /System -name "*.e5" 2>/dev/null | sort > e5_system_scan.txt || true
          wc -l e5_home_cache_scan.txt e5_system_scan.txt || true

      - name: Archive cache directory
        shell: bash
        run: |
          set -euxo pipefail
          CACHE_PARENT="$HOME/Library/Caches"
          TAR_ITEMS=()
          if [ -d "$CACHE_PARENT/org.python.python/com.apple.e5rt.e5bundlecache" ]; then
            TAR_ITEMS+=("org.python.python/com.apple.e5rt.e5bundlecache")
          fi
          if [ -d "$CACHE_PARENT/com.apple.e5rt.e5bundlecache" ]; then
            TAR_ITEMS+=("com.apple.e5rt.e5bundlecache")
          fi
          if [ "${#TAR_ITEMS[@]}" -eq 0 ]; then
            mkdir -p "$CACHE_PARENT/com.apple.e5rt.e5bundlecache"
            TAR_ITEMS+=("com.apple.e5rt.e5bundlecache")
          fi
          tar -czf e5bundlecache.tar.gz -C "$CACHE_PARENT" "${TAR_ITEMS[@]}"

      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: e5bundlecache-${{ github.run_id }}
          path: |
            e5bundlecache.tar.gz
            e5_cache_file_list.txt
            e5_files.txt
            active_cache_base.txt
            e5_home_cache_scan.txt
            e5_system_scan.txt
          if-no-files-found: warn
